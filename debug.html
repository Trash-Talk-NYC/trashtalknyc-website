<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trash Talk NYC — Event Function Debug</title>
<style>
  body { font-family: monospace; background: #1c1c22; color: #f7f4ed; padding: 2rem; font-size: 14px; }
  h1 { color: #f5d000; margin-bottom: 0.5rem; font-size: 1.2rem; }
  p { color: rgba(247,244,237,0.5); margin-bottom: 2rem; font-size: 0.85rem; }
  .test { margin-bottom: 1.5rem; border: 1px solid rgba(247,244,237,0.1); border-radius: 8px; overflow: hidden; }
  .test-header { padding: 0.75rem 1rem; font-weight: bold; font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase; }
  .pending  { background: rgba(247,244,237,0.08); color: rgba(247,244,237,0.5); }
  .running  { background: rgba(245,208,0,0.15);    color: #f5d000; }
  .pass     { background: rgba(42,107,42,0.25);    color: #6dde6d; }
  .fail     { background: rgba(194,65,12,0.25);    color: #ff7b5a; }
  .test-body { padding: 0.75rem 1rem; background: rgba(255,255,255,0.03); white-space: pre-wrap; word-break: break-all; color: rgba(247,244,237,0.7); font-size: 0.8rem; line-height: 1.6; }
  #copyBtn { margin-top: 2rem; background: #6b3fa0; color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; font-family: monospace; font-size: 0.85rem; font-weight: bold; cursor: pointer; letter-spacing: 0.05em; text-transform: uppercase; }
  #copyBtn:hover { background: #9b5de5; }
  #copied { color: #6dde6d; margin-left: 1rem; font-size: 0.8rem; display: none; }
</style>
</head>
<body>
<h1>🗑 Trash Talk NYC — Event Function Debug</h1>
<p>Run these tests then click "Copy Report" and paste it into Claude.</p>

<div class="test" id="t1">
  <div class="test-header pending" id="t1h">⏳ Test 1 — Function reachable (single event)</div>
  <div class="test-body" id="t1b">waiting...</div>
</div>

<div class="test" id="t2">
  <div class="test-header pending" id="t2h">⏳ Test 2 — Function reachable (?all=true)</div>
  <div class="test-body" id="t2b">waiting...</div>
</div>

<div class="test" id="t3">
  <div class="test-header pending" id="t3h">⏳ Test 3 — Environment (URL check)</div>
  <div class="test-body" id="t3b">waiting...</div>
</div>

<button id="copyBtn" onclick="copyReport()">Copy Report</button>
<span id="copied">Copied!</span>

<script>
  var results = {};

  function setStatus(id, status, label, body) {
    document.getElementById(id + 'h').className = 'test-header ' + status;
    document.getElementById(id + 'h').textContent = label;
    document.getElementById(id + 'b').textContent = typeof body === 'string' ? body : JSON.stringify(body, null, 2);
    results[id] = { status, label, body };
  }

  // Test 3: environment
  setStatus('t3', 'pass', '✓ Test 3 — URL: ' + location.origin, 'Page origin: ' + location.origin + '\nFunction URL: ' + location.origin + '/.netlify/functions/next-event\n\nIf origin is 127.0.0.1 or localhost, the function only works via `netlify dev` CLI, not Live Server.');

  // Test 1: single event
  setStatus('t1', 'running', '⟳ Test 1 — running...', '');
  fetch('/.netlify/functions/next-event')
    .then(function(r) {
      var status = r.status;
      return r.text().then(function(text) { return { status, text }; });
    })
    .then(function(r) {
      var parsed;
      try { parsed = JSON.parse(r.text); } catch(e) { parsed = r.text; }
      if (r.status === 200) {
        setStatus('t1', 'pass', '✓ Test 1 — HTTP ' + r.status + ' OK', parsed);
      } else {
        setStatus('t1', 'fail', '✗ Test 1 — HTTP ' + r.status, parsed);
      }
    })
    .catch(function(err) {
      setStatus('t1', 'fail', '✗ Test 1 — Network error (function not found or CORS)', err.message + '\n\nThis usually means:\n- You are on localhost and the function is not running\n- Solution: run `netlify dev` instead of Live Server');
    });

  // Test 2: all events
  setStatus('t2', 'running', '⟳ Test 2 — running...', '');
  fetch('/.netlify/functions/next-event?all=true')
    .then(function(r) {
      var status = r.status;
      return r.text().then(function(text) { return { status, text }; });
    })
    .then(function(r) {
      var parsed;
      try { parsed = JSON.parse(r.text); } catch(e) { parsed = r.text; }
      if (r.status === 200) {
        var summary = typeof parsed === 'object' && parsed !== null
          ? 'upcoming: ' + (parsed.upcoming || []).length + ' events\npast: ' + (parsed.past || []).length + ' events\n\nFull response:\n' + JSON.stringify(parsed, null, 2)
          : JSON.stringify(parsed, null, 2);
        setStatus('t2', 'pass', '✓ Test 2 — HTTP ' + r.status + ' OK', summary);
      } else {
        setStatus('t2', 'fail', '✗ Test 2 — HTTP ' + r.status, parsed);
      }
    })
    .catch(function(err) {
      setStatus('t2', 'fail', '✗ Test 2 — Network error', err.message);
    });

  function copyReport() {
    var lines = ['=== TRASH TALK NYC — EVENT FUNCTION DEBUG REPORT ===', ''];
    Object.values(results).forEach(function(r) {
      lines.push(r.label);
      lines.push(typeof r.body === 'string' ? r.body : JSON.stringify(r.body, null, 2));
      lines.push('');
    });
    navigator.clipboard.writeText(lines.join('\n')).then(function() {
      document.getElementById('copied').style.display = 'inline';
      setTimeout(function() { document.getElementById('copied').style.display = 'none'; }, 2000);
    });
  }
</script>
</body>
</html>
