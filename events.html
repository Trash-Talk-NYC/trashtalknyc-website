<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events — Trash Talk NYC</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --charcoal: #1c1c22;
    --off-white: #f7f4ed;
    --cream: #ede9df;
    --yellow: #f5d000;
    --yellow-dark: #c9a900;
    --purple: #6b3fa0;
    --purple-light: #9b5de5;
    --purple-pale: #f0e8ff;
    --green: #2a6b2a;
    --gray: #7a7a8a;
    --warm-gray: #b0aca2;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--off-white);
    color: var(--charcoal);
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.35;
  }

  /* ── SOCIAL BAR ── */
  .social-bar {
    background: var(--purple);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 0.45rem 2rem;
    flex-wrap: wrap;
  }
  .social-bar-text { font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 0.12em; }
  .social-bar a { display: flex; align-items: center; gap: 0.4rem; color: #fff; text-decoration: none; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.05em; transition: opacity 0.15s; }
  .social-bar a:hover { opacity: 0.75; }
  .social-bar svg { width: 15px; height: 15px; fill: currentColor; flex-shrink: 0; }
  .social-bar-divider { width: 1px; height: 14px; background: rgba(255,255,255,0.3); }

  /* ── NAV ── */
  nav {
    position: sticky; top: 0; z-index: 200;
    background: var(--charcoal);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2rem; height: 60px;
    border-bottom: 3px solid var(--purple-light);
  }
  .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--yellow); letter-spacing: 0.06em; text-decoration: none; white-space: nowrap; }
  .nav-logo span { color: var(--purple-light); }
  .nav-right { display: flex; align-items: center; gap: 2rem; order: 3; }
  .lang-toggle { display: flex; align-items: center; gap: 0; border: 2px solid var(--purple-light); border-radius: 20px; overflow: hidden; }
  .lang-btn { background: transparent; color: rgba(247,244,237,0.55); border: none; font-family: 'Space Mono', monospace; font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 0.3rem 0.75rem; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .lang-btn.active { background: var(--purple-light); color: #fff; }
  .lang-btn:hover:not(.active) { color: var(--off-white); }
  .nav-hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; }
  .nav-hamburger span { display: block; width: 22px; height: 2px; background: var(--off-white); border-radius: 2px; transition: all 0.25s; }
  .nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-hamburger.open span:nth-child(2) { opacity: 0; }
  .nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  .nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; order: 2; flex: 1; justify-content: center; }
  .nav-links a { color: rgba(247,244,237,0.75); text-decoration: none; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; transition: color 0.15s; }
  .nav-links a:hover, .nav-links a.active { color: var(--yellow); }
  .nav-cta { background: var(--yellow) !important; color: var(--charcoal) !important; padding: 0.4rem 1.1rem !important; border-radius: 4px !important; font-weight: 800 !important; }
  .nav-cta:hover { background: var(--purple-light) !important; color: #fff !important; }

  /* ── NEXT EVENT BANNER ── */
  .next-event-banner {
    background: var(--charcoal);
    border-bottom: 4px solid var(--yellow);
    padding: 3rem;
    position: relative;
    overflow: hidden;
    min-height: 180px;
    display: flex;
    align-items: center;
  }
  .next-event-banner::before {
    content: '';
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(-45deg, transparent, transparent 18px, rgba(107,63,160,0.06) 18px, rgba(107,63,160,0.06) 19px);
    pointer-events: none;
  }
  .next-event-banner::after {
    content: '';
    position: absolute;
    right: -5%; top: -20%;
    width: 40vw; height: 140%;
    background: radial-gradient(ellipse at center, rgba(107,63,160,0.22) 0%, transparent 65%);
    pointer-events: none;
  }
  .banner-inner {
    max-width: 1000px; margin: 0 auto; width: 100%;
    display: grid; grid-template-columns: 1fr auto;
    gap: 2.5rem; align-items: center;
    position: relative; z-index: 1;
  }
  .banner-eyebrow {
    font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em;
    color: var(--yellow); margin-bottom: 0.6rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .pulse-dot {
    width: 8px; height: 8px; background: var(--yellow); border-radius: 50%;
    display: inline-block; animation: pulseDot 1.6s ease-in-out infinite;
  }
  @keyframes pulseDot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.35; transform:scale(0.65); } }
  .banner-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.9rem, 3.5vw, 3rem);
    color: var(--off-white); line-height: 1; letter-spacing: 0.02em; margin-bottom: 0.8rem;
  }
  .banner-title span { color: var(--yellow); }
  .banner-meta { display: flex; flex-wrap: wrap; gap: 1.25rem; }
  .meta-chip { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; font-weight: 700; color: rgba(247,244,237,0.65); }
  .meta-chip svg { width: 13px; height: 13px; color: var(--purple-light); flex-shrink: 0; }
  .banner-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 1rem; flex-shrink: 0; }
  .countdown-row { display: flex; gap: 0.5rem; align-items: center; }
  .cd-unit { text-align: center; }
  .cd-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.75rem; color: var(--off-white); line-height: 1; display: block; }
  .cd-label { font-family: 'Space Mono', monospace; font-size: 0.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(247,244,237,0.3); display: block; }
  .cd-sep { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: rgba(247,244,237,0.2); margin-top: -6px; }
  .btn-rsvp {
    background: var(--yellow); color: var(--charcoal);
    font-family: 'Nunito', sans-serif; font-size: 0.82rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.1em;
    padding: 0.85rem 1.75rem; border: 3px solid var(--yellow); border-radius: 4px;
    text-decoration: none; display: inline-block;
    transition: all 0.18s; white-space: nowrap; cursor: pointer;
  }
  .btn-rsvp:hover { background: var(--purple-light); border-color: var(--purple-light); color: #fff; }
  .banner-loading { display: flex; align-items: center; gap: 0.4rem; color: rgba(247,244,237,0.35); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 2rem 0; }
  .banner-loading span { width: 6px; height: 6px; background: currentColor; border-radius: 50%; animation: loadDot 1.2s ease-in-out infinite; }
  .banner-loading span:nth-child(2) { animation-delay: 0.2s; }
  .banner-loading span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes loadDot { 0%,100% { opacity:0.2; transform:scale(0.7); } 50% { opacity:1; transform:scale(1); } }
  .banner-empty { color: rgba(247,244,237,0.45); font-size: 0.88rem; font-weight: 600; padding: 2rem 0; }
  .banner-empty a { color: var(--purple-light); text-decoration: underline; }

  /* ── EVENTS PAGE ── */
  .events-page { max-width: 1000px; margin: 0 auto; padding: 3.5rem 2rem 5rem; }
  .page-header { margin-bottom: 2.5rem; display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .section-label {
    font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--purple); margin-bottom: 0.4rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .section-label::before { content: ''; display: inline-block; width: 1.1rem; height: 3px; background: var(--purple-light); border-radius: 2px; }
  .section-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.2rem, 4vw, 3rem); line-height: 1; letter-spacing: 0.02em; }
  .eb-note { font-size: 0.72rem; font-weight: 700; color: var(--gray); display: flex; align-items: center; gap: 0.4rem; }
  .eb-badge { background: #f05537; color: #fff; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; padding: 0.2rem 0.55rem; border-radius: 20px; }

  /* ── EVENT CARDS ── */
  .events-list { display: flex; flex-direction: column; gap: 0.85rem; }
  .event-card {
    background: white; border: 2px solid #e0dcd4; border-radius: 12px;
    padding: 1.5rem 1.75rem;
    display: grid; grid-template-columns: 72px 1fr auto;
    gap: 1.5rem; align-items: center;
    transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s;
    text-decoration: none; color: inherit;
  }
  .event-card:hover { border-color: var(--purple-light); box-shadow: 0 4px 20px rgba(107,63,160,0.12); transform: translateY(-1px); }
  .event-card.upcoming { border-left: 4px solid var(--purple-light); padding-left: calc(1.75rem - 2px); }
  .event-card.past { opacity: 0.55; }
  .event-card.past:hover { opacity: 0.75; }
  .event-date-block { text-align: center; background: var(--purple-pale); border-radius: 8px; padding: 0.6rem 0.5rem; flex-shrink: 0; }
  .event-date-block .month { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--purple); display: block; }
  .event-date-block .day { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--charcoal); line-height: 1; display: block; }
  .event-date-block .dow { font-size: 0.58rem; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: 0.1em; display: block; }
  .event-info { min-width: 0; }
  .event-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.35rem; letter-spacing: 0.03em; margin-bottom: 0.3rem; }
  .event-details { display: flex; flex-wrap: wrap; gap: 1rem; }
  .event-detail { display: flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; font-weight: 700; color: var(--gray); }
  .event-detail svg { width: 12px; height: 12px; flex-shrink: 0; }
  .event-tags { display: flex; gap: 0.4rem; margin-top: 0.6rem; flex-wrap: wrap; }
  .event-tag { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; padding: 0.18rem 0.55rem; border-radius: 20px; border: 1.5px solid; }
  .tag-brooklyn { color: #2563eb; border-color: rgba(37,99,235,0.3); background: rgba(37,99,235,0.06); }
  .tag-manhattan { color: var(--purple); border-color: rgba(107,63,160,0.3); background: rgba(107,63,160,0.06); }
  .tag-queens { color: var(--green); border-color: rgba(42,107,42,0.3); background: rgba(42,107,42,0.06); }
  .tag-bronx { color: #c2410c; border-color: rgba(194,65,12,0.3); background: rgba(194,65,12,0.06); }
  .tag-staten { color: #0891b2; border-color: rgba(8,145,178,0.3); background: rgba(8,145,178,0.06); }
  .event-cta { flex-shrink: 0; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }
  .btn-card {
    display: inline-block; font-family: 'Nunito', sans-serif;
    font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 0.55rem 1.1rem; border-radius: 5px; border: 2.5px solid;
    cursor: pointer; text-decoration: none; transition: all 0.15s; white-space: nowrap;
  }
  .btn-card-purple { background: var(--purple); color: #fff; border-color: var(--purple); }
  .btn-card-purple:hover { background: var(--purple-light); border-color: var(--purple-light); }
  .btn-card-ghost { background: transparent; color: var(--gray); border-color: #d0ccd8; }
  .btn-card-ghost:hover { border-color: var(--gray); color: var(--charcoal); }
  .card-status { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
  .card-status.completed { color: var(--warm-gray); }

  /* ── PAST DIVIDER ── */
  .past-divider { display: flex; align-items: center; gap: 1rem; margin: 2.5rem 0 1.25rem; }
  .past-divider-line { flex: 1; height: 1px; background: #ddd; }
  .past-divider-label { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.16em; color: var(--gray); white-space: nowrap; }

  /* ── SKELETONS ── */
  .skeleton-card { background: white; border: 2px solid #e0dcd4; border-radius: 12px; padding: 1.5rem 1.75rem; display: flex; gap: 1.5rem; align-items: center; }
  .skel { background: linear-gradient(90deg, #e8e4dc 25%, #f0ece4 50%, #e8e4dc 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skel-date { width: 72px; height: 80px; border-radius: 8px; flex-shrink: 0; }
  .skel-body { flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
  .skel-title { height: 22px; width: 55%; }
  .skel-meta { height: 14px; width: 80%; }
  .skel-tags { height: 14px; width: 35%; }

  /* ── EMPTY STATE ── */
  .events-empty { text-align: center; padding: 4rem 2rem; color: var(--gray); }
  .events-empty h3 { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; margin-bottom: 0.5rem; color: var(--charcoal); }
  .events-empty p { font-size: 0.9rem; font-weight: 600; }
  .events-empty a { color: var(--purple); font-weight: 700; }

  /* ── FOOTER ── */
  footer { background: var(--charcoal); color: rgba(247,244,237,0.5); padding: 2.5rem 2rem; display: flex; flex-direction: column; align-items: center; gap: 1.25rem; border-top: 3px solid var(--purple-light); text-align: center; }
  .footer-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--yellow); letter-spacing: 0.06em; }
  .footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; list-style: none; }
  .footer-links a { color: rgba(247,244,237,0.5); text-decoration: none; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; transition: color 0.15s; }
  .footer-links a:hover { color: var(--yellow); }
  .footer-copy { font-size: 0.7rem; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    nav { padding: 0 1.25rem; flex-wrap: wrap; height: auto; min-height: 60px; }
    .nav-hamburger { display: flex; }
    .nav-links { display: none; width: 100%; flex-direction: column; gap: 0; padding: 0.5rem 0 1rem; order: 3; }
    .nav-links.open { display: flex; }
    .nav-links li { border-top: 1px solid rgba(247,244,237,0.1); }
    .nav-links a { display: block; padding: 0.75rem 0.5rem; font-size: 0.9rem; text-align: center; }
    .nav-links .nav-cta { margin: 0.6rem 0 0.25rem; padding: 0.7rem 1.25rem; border-radius: 6px; text-align: center; display: block; }
    .nav-right { gap: 0.5rem; }
    .next-event-banner { padding: 2rem 1.5rem; }
    .banner-inner { grid-template-columns: 1fr; }
    .banner-actions { align-items: flex-start; flex-direction: row; flex-wrap: wrap; gap: 1rem; }
    .events-page { padding: 2.5rem 1.25rem 4rem; }
    .event-card { grid-template-columns: 60px 1fr; }
    .event-cta { display: none; }
  }

  @media (max-width: 480px) {
    .event-card { grid-template-columns: 1fr; gap: 0.75rem; }
    .event-date-block { display: flex; gap: 0.5rem; align-items: baseline; width: fit-content; padding: 0.4rem 0.75rem; }
    .event-date-block .day { font-size: 1.4rem; }
    .event-cta { display: flex; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- NEXT EVENT BANNER -->

  <div style="position:relative;z-index:1;width:100%;max-width:1000px;margin:0 auto">

  </ul>

</footer>

<script>
  // ── MOBILE NAV ──
  function toggleMobileNav() {
    document.getElementById('navHamburger').classList.toggle('open');
    document.getElementById('navLinks').classList.toggle('open');
  }
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.nav-links a').forEach(function(a) {
      a.addEventListener('click', function() {
        document.getElementById('navHamburger').classList.remove('open');
        document.getElementById('navLinks').classList.remove('open');
      });
    });
  });

  // ── LANG TOGGLE ──
  let currentLang = 'en';
  function setLang(lang) {
    currentLang = lang;
    document.getElementById('btnEN').classList.toggle('active', lang === 'en');
    document.getElementById('btnES').classList.toggle('active', lang === 'es');
    document.documentElement.lang = lang;
  }

  // ── HELPERS ──
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function parseDate(isoStr) {
    return new Date(isoStr);
  }

  function fmtTime(d) {
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  }

  function boroughTag(text) {
    var t = (text || '').toLowerCase();
    if (t.includes('brooklyn'))  return '<span class="event-tag tag-brooklyn">Brooklyn</span>';
    if (t.includes('manhattan') || t.includes('harlem') || t.includes('inwood') || t.includes('bronx') === false && t.includes('new york, ny')) return '<span class="event-tag tag-manhattan">Manhattan</span>';
    if (t.includes('queens'))    return '<span class="event-tag tag-queens">Queens</span>';
    if (t.includes('bronx'))     return '<span class="event-tag tag-bronx">The Bronx</span>';
    if (t.includes('staten'))    return '<span class="event-tag tag-staten">Staten Island</span>';
    return '';
  }

  function buildCard(ev, isPast) {
    var start = parseDate(ev.start.local || ev.start.utc);
    var end   = parseDate(ev.end.local   || ev.end.utc);
    var loc   = ev.venue ? (ev.venue.name || ev.venue.address || '') : '';
    var locFull = ev.venue ? (loc + (ev.venue.city ? ', ' + ev.venue.city : '')) : '';
    var borough = boroughTag(locFull + ' ' + (ev.venue ? ev.venue.address || '' : ''));

    var cta = isPast
      ? '<div class="event-cta"><span class="card-status completed">Completed</span></div>'
      : '<div class="event-cta"><a class="btn-card btn-card-purple" href="' + ev.url + '" target="_blank" rel="noopener">RSVP →</a></div>';

    return '<a class="event-card ' + (isPast ? 'past' : 'upcoming') + '" href="' + ev.url + '" target="_blank" rel="noopener">' +
      '<div class="event-date-block">' +
        '<span class="month">' + MONTHS[start.getMonth()] + '</span>' +
        '<span class="day">' + start.getDate() + '</span>' +
        '<span class="dow">' + DAYS[start.getDay()] + '</span>' +
      '</div>' +
      '<div class="event-info">' +
        '<div class="event-name">' + ev.name + '</div>' +
        '<div class="event-details">' +
          '<span class="event-detail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' + fmtTime(start) + ' – ' + fmtTime(end) + '</span>' +
          (locFull ? '<span class="event-detail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' + locFull + '</span>' : '') +
        '</div>' +
        (borough ? '<div class="event-tags">' + borough + '</div>' : '') +
      '</div>' +
      cta +
    '</a>';
  }

  function startCountdown(isoStr, el) {
    function tick() {
      var diff = new Date(isoStr) - new Date();
      if (diff <= 0) { clearInterval(t); return; }
      var d = Math.floor(diff / 864e5);
      var h = Math.floor((diff % 864e5) / 36e5);
      var m = Math.floor((diff % 36e5) / 6e4);
      var p = function(n) { return String(n).padStart(2,'0'); };
      el.innerHTML =
        '<div class="cd-unit"><span class="cd-num">' + p(d) + '</span><span class="cd-label">days</span></div>' +
        '<span class="cd-sep">:</span>' +
        '<div class="cd-unit"><span class="cd-num">' + p(h) + '</span><span class="cd-label">hrs</span></div>' +
        '<span class="cd-sep">:</span>' +
        '<div class="cd-unit"><span class="cd-num">' + p(m) + '</span><span class="cd-label">min</span></div>';
    }
    tick();
    var t = setInterval(tick, 30000);
  }

  function renderBanner(ev) {
    var wrap = document.getElementById('bannerWrap');
    if (!ev) {
      wrap.innerHTML = '<div style="position:relative;z-index:1;width:100%;max-width:1000px;margin:0 auto"><div class="banner-empty">No upcoming events right now — follow <a href="https://instagram.com/trashtalk_nyc" target="_blank" rel="noopener">@trashtalk_nyc</a> for updates.</div></div>';
      return;
    }
    var start = parseDate(ev.start.local || ev.start.utc);
    var end   = parseDate(ev.end.local   || ev.end.utc);
    var loc   = ev.venue ? ((ev.venue.name || '') + (ev.venue.city ? ', ' + ev.venue.city : '')) : '';
    var parts = ev.name.split(/\s+/);
    var half  = Math.ceil(parts.length / 2);
    var nameHtml = parts.slice(0, half).join(' ') + ' <span>' + parts.slice(half).join(' ') + '</span>';
    var dateStr = start.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

    wrap.innerHTML =
      '<div class="banner-inner">' +
        '<div>' +
          '<div class="banner-eyebrow"><span class="pulse-dot"></span> Next cleanup event</div>' +
          '<div class="banner-title">' + nameHtml + '</div>' +
          '<div class="banner-meta">' +
            '<span class="meta-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' + dateStr + '</span>' +
            '<span class="meta-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' + fmtTime(start) + ' – ' + fmtTime(end) + '</span>' +
            (loc ? '<span class="meta-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' + loc + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="banner-actions">' +
          '<div class="countdown-row" id="bannerCountdown"></div>' +
          '<a class="btn-rsvp" href="' + ev.url + '" target="_blank" rel="noopener">RSVP on Eventbrite →</a>' +
        '</div>' +
      '</div>';

    startCountdown(ev.start.utc || ev.start.local, document.getElementById('bannerCountdown'));
  }

  // ── FETCH ALL EVENTS ──
  fetch('/.netlify/functions/next-event?all=true')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      document.getElementById('skeletons').remove();

      var upcoming = data.upcoming || [];
      var past     = data.past     || [];

      renderBanner(upcoming[0] || null);

      var upList = document.getElementById('upcomingList');
      if (upcoming.length === 0) {
        upList.innerHTML = '<div class="events-empty"><h3>No Upcoming Events</h3><p>Follow <a href="https://instagram.com/trashtalk_nyc" target="_blank" rel="noopener">@trashtalk_nyc</a> for new dates.</p></div>';
      } else {
        upList.innerHTML = '<div class="events-list">' + upcoming.map(function(e) { return buildCard(e, false); }).join('') + '</div>';
      }

      if (past.length > 0) {
        document.getElementById('pastSection').style.display = 'block';
        document.getElementById('pastList').innerHTML = past.map(function(e) { return buildCard(e, true); }).join('');
      }
    })
    .catch(function() {
      document.getElementById('skeletons').remove();
      document.getElementById('bannerWrap').innerHTML = '<div style="position:relative;z-index:1;width:100%;max-width:1000px;margin:0 auto"><div class="banner-empty">Could not load events. Visit <a href="https://www.eventbrite.com" target="_blank" rel="noopener">Eventbrite</a> directly.</div></div>';
      document.getElementById('upcomingList').innerHTML = '<div class="events-empty"><h3>Could Not Load Events</h3><p>Please try again later or follow <a href="https://instagram.com/trashtalk_nyc" target="_blank" rel="noopener">@trashtalk_nyc</a>.</p></div>';
    });
</script>

</body>
</html>
