[build]
  command = "npm run build"
  publish = "dist"

# Baseline security headers. A full Content-Security-Policy is deliberately
# deferred: the pages rely on is:inline scripts and onclick handlers, so a
# strict CSP needs hashes or a refactor first.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Geolocation is used for event-distance sorting; leave it enabled.
    Permissions-Policy = "camera=(), microphone=(), payment=()"
